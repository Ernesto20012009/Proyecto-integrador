<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaginaInicio</title>
    <!--CSS INICIO-->
    <link rel="stylesheet" href="./css/inicio.css">
    <!--CSS ACERCA DE-->
    <link rel="stylesheet" href="./css/acercade.css">
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Bootstrap iconos-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <section id="inicio"></section>
    <!--Hero-->
    <section class="bg-white border-bottom border-secondary-subtle">
        <div class="container py-5">
            <div class="row align-items-center g-4">
                <!-- Contenido -->
                <div class="col-12 col-md-6">
                    <h1 class="display-5 fw-bold mb-3">
                        Descubre, reseña y comparte tus videojuegos
                    </h1>
                    <p class="lead text-secondary mb-4">
                        La plataforma donde gamers opinan. Explora miles de títulos, lee reseñas de la comunidad y crea
                        las tuyas.
                    </p>

                    <div class="d-flex flex-column flex-sm-row gap-2 mb-5">
                        <button class="btn btn-primary px-4">Explorar juegos</button>
                        <button class="btn btn-outline-secondary px-4">Crear cuenta</button>
                    </div>

                    <div class="border-top pt-4 d-flex gap-5">
                        <div>
                            <div class="h5 fw-bold">2,400+</div>
                            <small class="text-secondary">Juegos</small>
                        </div>
                        <div>
                            <div class="h5 fw-bold">18,500+</div>
                            <small class="text-secondary">Reseñas</small>
                        </div>
                        <div>
                            <div class="h5 fw-bold">4,200+</div>
                            <small class="text-secondary">Usuarios</small>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-6">
                    <div class="bg-light border rounded overflow-hidden">
                        <img src="./IMAGE/Hero.jpg" alt="Hero imagen" class="img-fluid w-90 d-block" style="object-fit: cover;">
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!--Juegos Destacados-->
    <section id="juegosDestacados">
        <h2 class="fw-bold mb-4">Juegos Destacados</h2>
        <!--Contenedor vacio donde juegosDestacados.js inserta el catalogo de juegos con tarjetas-->
        <div id="container-juegos-destacados" class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4"></div>

    </section>
    
    <!--Script juegosDestacados.js-->
    <script src="./JS/juegosDestacados.js"> </script>
    <!--Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
